<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Training pipeline for a single-camera biomechanics agent with privileged, checked supervision</title>
  <desc id="desc">Three lanes. Data: the StaBLE ledger is split by participant into five development folds and a sealed confirmatory set, with three tasks held out. Training: a vision-language agent calls cached tools on single-camera video, submits feature values with code and cited evidence, a verifier checks them, and a fixed formula computes the score; a three-camera reference available only during training supplies the per-feature reward, a privileged teacher, and labels for a tool-outcome model. Confirmation: the frozen agent is run once on the sealed participants and held-out tasks.</desc>
  <defs>
    <marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
    <marker id="a-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker>
    <marker id="a-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#0F172A" flood-opacity="0.07"/></filter>
    <symbol id="lock" viewBox="0 0 16 18"><path d="M4 8 V5.5 a4 4 0 0 1 8 0 V8" fill="none" stroke="#BE123C" stroke-width="1.8"/><rect x="1.5" y="8" width="13" height="9" rx="2" fill="#BE123C"/><circle cx="8" cy="12.4" r="1.4" fill="#FFF1F2"/></symbol>
  </defs>

  <rect width="1600" height="980" fill="#FFFFFF"/>

  <!-- Title and legend -->
  <text x="40" y="44" font-size="24" font-weight="700" fill="#0F172A">From one camera to a checked balance score</text>
  <text x="40" y="70" font-size="14" fill="#475569">Three-camera data shape the reward, the teacher and the tool-outcome model during training, and never reach the agent at test time.</text>
  <g font-size="12" fill="#475569">
    <line x1="1218" y1="32" x2="1258" y2="32" stroke="#64748B" stroke-width="2" marker-end="url(#a-slate)"/>
    <text x="1266" y="36">data and tool flow</text>
    <line x1="1218" y1="56" x2="1258" y2="56" stroke="#D97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-amber)"/>
    <text x="1266" y="60">training-only signal</text>
    <line x1="1406" y1="32" x2="1446" y2="32" stroke="#4F46E5" stroke-width="2" marker-end="url(#a-indigo)"/>
    <text x="1454" y="36">model update</text>
    <use href="#lock" x="1420" y="46" width="14" height="16"/>
    <text x="1454" y="60">sealed until the end</text>
  </g>

  <!-- ============ Lane 1: data ============ -->
  <rect x="24" y="92" width="1552" height="176" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="118" font-size="12" font-weight="700" letter-spacing="1.2" fill="#64748B">1 · DATA, FIXED BEFORE ANY TRAINING</text>

  <g filter="url(#soft)">
    <rect x="44" y="132" width="300" height="120" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  </g>
  <text x="64" y="160" font-size="16" font-weight="700" fill="#0F172A">StaBLE ledger</text>
  <g font-size="12.5" fill="#334155">
    <text x="64" y="184">180 people · 18 tasks · 3,322 trials</text>
    <text x="64" y="204">Status per trial: measured, assigned,</text>
    <text x="64" y="222">imputed, flagged or excluded</text>
    <text x="64" y="240">Cam0 video linked to 3-camera reference</text>
  </g>
  <line x1="344" y1="190" x2="392" y2="190" stroke="#64748B" stroke-width="2" marker-end="url(#a-slate)"/>

  <text x="400" y="150" font-size="13" font-weight="600" fill="#334155">Split by participant, stratified by score quintile, age group and elite status</text>
  <g font-size="12" font-weight="600" fill="#1E3A8A" text-anchor="middle">
    <rect x="400" y="162" width="93" height="40" rx="8" fill="#DBEAFE"/><text x="446.5" y="187">Fold 1</text>
    <rect x="496" y="162" width="93" height="40" rx="8" fill="#DBEAFE"/><text x="542.5" y="187">Fold 2</text>
    <rect x="592" y="162" width="93" height="40" rx="8" fill="#DBEAFE"/><text x="638.5" y="187">Fold 3</text>
    <rect x="688" y="162" width="93" height="40" rx="8" fill="#DBEAFE"/><text x="734.5" y="187">Fold 4</text>
    <rect x="784" y="162" width="93" height="40" rx="8" fill="#DBEAFE"/><text x="830.5" y="187">Fold 5</text>
  </g>
  <rect x="884" y="162" width="256" height="40" rx="8" fill="#FFE4E6" stroke="#FDA4AF"/>
  <use href="#lock" x="944" y="173" width="14" height="16"/>
  <text x="966" y="187" font-size="12.5" font-weight="700" fill="#9F1239">Sealed · 60 people</text>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="638" y="222">Development · 111 people in 5 folds</text>
    <text x="1012" y="222">Reserved before any analysis</text>
  </g>
  <text x="400" y="248" font-size="12" fill="#64748B">Endpoints, fallback means, probe videos and demonstrations come only from each fold's training part.</text>

  <g filter="url(#soft)">
    <rect x="1176" y="132" width="380" height="120" rx="12" fill="#FFFFFF" stroke="#FDA4AF" stroke-dasharray="5 4"/>
  </g>
  <text x="1196" y="160" font-size="16" font-weight="700" fill="#0F172A">Held-out tasks (transfer test)</text>
  <g font-size="12.5" fill="#334155">
    <text x="1196" y="184">Semi-Tandem · Gait-Backwards · Functional Reach</text>
    <text x="1196" y="204">Videos excluded from every training stage;</text>
    <text x="1196" y="222">feature definitions first shown at confirmation;</text>
    <text x="1196" y="240">scales and probes from a calibration set</text>
  </g>

  <!-- ============ Lane 2: training ============ -->
  <rect x="24" y="284" width="1552" height="460" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="44" y="310" font-size="12" font-weight="700" letter-spacing="1.2" fill="#64748B">2 · TRAINING, DEVELOPMENT FOLDS ONLY</text>

  <!-- input -->
  <g filter="url(#soft)"><rect x="44" y="330" width="196" height="128" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/></g>
  <rect x="64" y="344" width="40" height="28" rx="5" fill="#E2E8F0"/>
  <path d="M79 351 L91 358 L79 365 z" fill="#475569"/>
  <text x="64" y="396" font-size="16" font-weight="700" fill="#0F172A">Cam0 video</text>
  <g font-size="12.5" fill="#334155">
    <text x="64" y="416">One smartphone view,</text>
    <text x="64" y="434">original timestamps kept,</text>
    <text x="64" y="452">plus task text and units</text>
  </g>
  <line x1="240" y1="394" x2="286" y2="394" stroke="#64748B" stroke-width="2" marker-end="url(#a-slate)"/>

  <!-- agent -->
  <g filter="url(#soft)"><rect x="292" y="322" width="256" height="144" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/></g>
  <text x="312" y="352" font-size="17" font-weight="700" fill="#3730A3">Agent policy</text>
  <text x="312" y="374" font-size="13" fill="#4338CA">Qwen3-VL-8B in a tool harness</text>
  <g font-size="13" fill="#312E81">
    <text x="312" y="400">· chooses tools and settings</text>
    <text x="312" y="420">· inspects frames and plots</text>
    <text x="312" y="440">· writes feature code</text>
  </g>

  <!-- agent <-> tools -->
  <line x1="548" y1="372" x2="596" y2="372" stroke="#64748B" stroke-width="2" marker-end="url(#a-slate)"/>
  <line x1="600" y1="414" x2="552" y2="414" stroke="#64748B" stroke-width="2" marker-end="url(#a-slate)"/>
  <text x="572" y="364" font-size="11" fill="#64748B" text-anchor="middle">call</text>
  <text x="574" y="432" font-size="11" fill="#64748B" text-anchor="middle">result</text>

  <!-- tools -->
  <g filter="url(#soft)"><rect x="602" y="322" width="300" height="194" rx="14" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.5"/></g>
  <text x="622" y="350" font-size="16" font-weight="700" fill="#115E59">Cached tools</text>
  <g font-size="12.5" fill="#134E4A">
    <rect x="622" y="362" width="76" height="24" rx="12" fill="#CCFBF1"/><text x="636" y="379">pose2d</text>
    <rect x="706" y="362" width="128" height="24" rx="12" fill="#CCFBF1"/><text x="720" y="379">segment_person</text>
    <rect x="622" y="394" width="108" height="24" rx="12" fill="#CCFBF1"/><text x="636" y="411">track_points</text>
    <rect x="738" y="394" width="118" height="24" rx="12" fill="#CCFBF1"/><text x="752" y="411">frames · plot</text>
    <rect x="622" y="426" width="214" height="24" rx="12" fill="#CCFBF1"/><text x="636" y="443">reconstruct3d · ~4 GPU-min</text>
    <rect x="622" y="458" width="132" height="24" rx="12" fill="#CCFBF1"/><text x="636" y="475">python sandbox</text>
  </g>
  <text x="622" y="504" font-size="11.5" fill="#0F766E">key: video · tool version · arguments</text>

  <!-- tool-outcome model -->
  <g filter="url(#soft)"><rect x="292" y="486" width="256" height="76" rx="12" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/></g>
  <text x="312" y="512" font-size="14.5" font-weight="700" fill="#5B21B6">Tool-outcome model</text>
  <g font-size="12.5" fill="#6D28D9">
    <text x="312" y="532">predicts a call's error and cost</text>
    <text x="312" y="550">before the agent makes it</text>
  </g>
  <line x1="420" y1="467" x2="420" y2="485" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="428" y="481" font-size="11" fill="#6D28D9">consulted before costly calls</text>

  <!-- submission, verifier, formula -->
  <line x1="902" y1="394" x2="944" y2="394" stroke="#64748B" stroke-width="2" marker-end="url(#a-slate)"/>
  <g filter="url(#soft)"><rect x="948" y="330" width="214" height="128" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/></g>
  <text x="968" y="358" font-size="16" font-weight="700" fill="#0F172A">Submission</text>
  <g font-size="12.5" fill="#334155">
    <text x="968" y="380">feature values in units</text>
    <text x="968" y="400">+ feature code</text>
    <text x="968" y="420">+ cited tool outputs</text>
    <text x="968" y="440">+ start/end annotations</text>
  </g>
  <line x1="1162" y1="394" x2="1196" y2="394" stroke="#64748B" stroke-width="2" marker-end="url(#a-slate)"/>

  <g filter="url(#soft)"><rect x="1196" y="330" width="178" height="132" rx="12" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/></g>
  <text x="1216" y="358" font-size="16" font-weight="700" fill="#065F46">Check</text>
  <g font-size="12.5" fill="#047857">
    <text x="1220" y="378">replay, incl. noisy copy</text>
    <text x="1220" y="396">required-signal test</text>
    <text x="1220" y="414">known-answer probes</text>
    <text x="1220" y="432">on development videos</text>
    <text x="1220" y="450">range check</text>
  </g>
  <line x1="1370" y1="394" x2="1398" y2="394" stroke="#059669" stroke-width="2" marker-end="url(#a-emerald)"/>

  <g filter="url(#soft)"><rect x="1402" y="330" width="154" height="128" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/></g>
  <text x="1420" y="358" font-size="15" font-weight="700" fill="#0F172A">StaBLE formula</text>
  <g font-size="12.5" fill="#334155">
    <text x="1420" y="380">fixed, in code;</text>
    <text x="1420" y="400">submitted features;</text>
    <text x="1420" y="420">failures → task mean</text>
    <text x="1420" y="440" font-weight="600">→ task score</text>
  </g>

  <!-- privileged band -->
  <rect x="602" y="532" width="954" height="182" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-dasharray="6 5"/>
  <text x="622" y="556" font-size="12" font-weight="700" letter-spacing="1" fill="#B45309">TRAINING ONLY · 3-CAMERA REFERENCE</text>

  <g filter="url(#soft)"><rect x="622" y="570" width="250" height="126" rx="12" fill="#FFFFFF" stroke="#FCD34D"/></g>
  <text x="642" y="596" font-size="15" font-weight="700" fill="#92400E">Reference values</text>
  <g font-size="12.5" fill="#78350F">
    <text x="642" y="618">features for every trial</text>
    <text x="642" y="636">task start and end times</text>
    <text x="642" y="654">imputed and flagged rows</text>
    <text x="642" y="672">masked from rewards</text>
  </g>
  <line x1="872" y1="632" x2="888" y2="632" stroke="#D97706" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#a-amber)"/>

  <g filter="url(#soft)"><rect x="892" y="570" width="300" height="126" rx="12" fill="#FFFFFF" stroke="#FCD34D"/></g>
  <text x="912" y="596" font-size="15" font-weight="700" fill="#92400E">Measurement reward</text>
  <g font-size="12.5" fill="#78350F">
    <text x="912" y="616">− feature errors, unchecked</text>
    <text x="912" y="633">  features penalized, timing error</text>
    <text x="912" y="650">− λ · tool cost (cost-aware arm)</text>
    <text x="912" y="667">malformed answers always rank last</text>
    <text x="912" y="686" font-style="italic">final-score reward = control arm</text>
  </g>

  <g filter="url(#soft)"><rect x="1212" y="570" width="330" height="126" rx="12" fill="#FFFFFF" stroke="#FCD34D"/></g>
  <text x="1232" y="596" font-size="15" font-weight="700" fill="#92400E">Privileged teacher</text>
  <g font-size="12.5" fill="#78350F">
    <text x="1232" y="618">sees the reference panel but acts only</text>
    <text x="1232" y="636">through the student's tools; kept if</text>
    <text x="1232" y="654">checked and still accurate on five</text>
    <text x="1232" y="672">other videos of the same task</text>
  </g>

  <!-- verifier verdicts to reward -->
  <path d="M1285 458 V514 H1042 V566" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-emerald)"/>
  <text x="1110" y="508" font-size="11" fill="#047857">verdicts + values</text>

  <!-- reference to tool-outcome model -->
  <path d="M622 600 H576 V524 H552" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#a-amber)"/>

  <!-- update levers -->
  <text x="44" y="704" font-size="12" font-weight="700" letter-spacing="1" fill="#4338CA">HOW THE AGENT IS UPDATED</text>
  <path d="M128 618 V606 H486 V618 M302 606 V618" fill="none" stroke="#4F46E5" stroke-width="2"/>
  <g filter="url(#soft)">
    <rect x="44" y="618" width="168" height="60" rx="12" fill="#EEF2FF" stroke="#A5B4FC"/>
    <rect x="222" y="618" width="160" height="60" rx="12" fill="#EEF2FF" stroke="#A5B4FC"/>
    <rect x="392" y="618" width="188" height="60" rx="12" fill="#EEF2FF" stroke="#A5B4FC"/>
  </g>
  <g font-size="13" fill="#312E81">
    <text x="60" y="644" font-weight="700">Prompt and harness</text>
    <text x="60" y="664">search, no weights</text>
    <text x="238" y="644" font-weight="700">SFT warm start</text>
    <text x="238" y="664">from demonstrations</text>
    <text x="408" y="644" font-weight="700">GRPO</text>
    <text x="408" y="664">8 rollouts per video</text>
  </g>
  <path d="M1042 696 V722 H486 V682" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#a-amber)"/>
  <path d="M1377 696 V734 H302 V682" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#a-amber)"/>
  <path d="M268 606 V444 H288" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#a-indigo)"/>
  <text x="256" y="524" font-size="11" fill="#4338CA" text-anchor="middle" transform="rotate(-90 256 524)">updates harness or weights</text>

  <!-- ============ Lane 3: confirmation ============ -->
  <rect x="24" y="760" width="1552" height="200" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="44" y="786" font-size="12" font-weight="700" letter-spacing="1.2" fill="#64748B">3 · CONFIRMATION, SEALED SET OPENED ONCE</text>

  <g filter="url(#soft)"><rect x="44" y="804" width="220" height="132" rx="12" fill="#EEF2FF" stroke="#A5B4FC"/></g>
  <text x="64" y="832" font-size="16" font-weight="700" fill="#3730A3">Frozen agent</text>
  <g font-size="12.5" fill="#312E81">
    <text x="64" y="856">weights, harness, prompts</text>
    <text x="64" y="876">and tool-outcome model</text>
    <text x="64" y="896">locked before unsealing</text>
  </g>
  <line x1="264" y1="870" x2="296" y2="870" stroke="#64748B" stroke-width="2" marker-end="url(#a-slate)"/>

  <g filter="url(#soft)"><rect x="300" y="804" width="250" height="132" rx="12" fill="#FFF1F2" stroke="#FDA4AF"/></g>
  <use href="#lock" x="320" y="815" width="14" height="16"/>
  <text x="342" y="830" font-size="16" font-weight="700" fill="#9F1239">Sealed participants</text>
  <g font-size="12.5" fill="#881337">
    <text x="320" y="856">60 people, all eligible tasks,</text>
    <text x="320" y="876">plus the 3 held-out tasks;</text>
    <text x="320" y="896">every row scored, fallbacks</text>
    <text x="320" y="914">counted and reported</text>
  </g>
  <line x1="550" y1="870" x2="582" y2="870" stroke="#64748B" stroke-width="2" marker-end="url(#a-slate)"/>

  <text x="590" y="824" font-size="13" font-weight="700" fill="#334155">Outcomes, each computed within task, then averaged</text>
  <g font-size="12.5" fill="#334155">
    <rect x="590" y="836" width="196" height="28" rx="14" fill="#FFE4E6" stroke="#FB7185"/><text x="606" y="855" font-weight="700" fill="#9F1239">Rank agreement (primary)</text>
    <rect x="794" y="836" width="150" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><text x="810" y="855">Skill vs. constant</text>
    <rect x="952" y="836" width="150" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><text x="968" y="855">Calibration slope</text>
    <rect x="1110" y="836" width="126" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><text x="1126" y="855">Feature error</text>
    <rect x="590" y="872" width="176" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><text x="606" y="891">Age-adjusted rank</text>
    <rect x="774" y="872" width="160" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><text x="790" y="891">Checked coverage</text>
    <rect x="942" y="872" width="160" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><text x="958" y="891">Transfer tasks</text>
    <rect x="1110" y="872" width="126" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/><text x="1126" y="891">Tool cost</text>
  </g>
  <text x="590" y="926" font-size="12" fill="#64748B">Controls: demographic-only, single frame, time-scaling interventions, expert pipeline, tool-feature regressor</text>
  <line x1="1240" y1="870" x2="1268" y2="870" stroke="#64748B" stroke-width="2" marker-end="url(#a-slate)"/>

  <g filter="url(#soft)"><rect x="1272" y="804" width="284" height="132" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/></g>
  <text x="1292" y="832" font-size="16" font-weight="700" fill="#0F172A">Inference</text>
  <g font-size="12.5" fill="#334155">
    <text x="1292" y="856">mean gain over 7 paired seeds,</text>
    <text x="1292" y="876">seed and participant uncertainty</text>
    <text x="1292" y="896">combined; fixed testing order,</text>
    <text x="1292" y="916">then Holm across S2–S5</text>
  </g>
</svg>
