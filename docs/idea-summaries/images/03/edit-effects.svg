<svg xmlns="http://www.w3.org/2000/svg" width="724" height="328" viewBox="0 0 724 328" role="img" aria-labelledby="title desc">
 <title id="title">What changes after an event-rule edit</title><desc id="desc">Cached pose data also feed an unchanged plot. A new event rule can change a subsequent agent decision and trigger a different continuation.</desc>
 <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5b6b"/></marker></defs>
 <rect x="1" y="1" width="722" height="326" rx="12" fill="#fbfaf6" stroke="#d2d6d6"/>
 <g font-family="Arial, Helvetica, sans-serif" fill="#172e42"><text x="24" y="35" font-size="22" font-weight="700" fill="#172e42" text-anchor="start">An event-rule edit leaves two kinds of evidence</text><rect x="24" y="128" width="167" height="68" rx="8" fill="#ddede7" stroke="#9caaaf"/><text x="36" y="154" font-size="18" font-weight="700" fill="#172e42" text-anchor="start">Pose sequence</text><text x="36" y="179" font-size="16" font-weight="400" fill="#172e42" text-anchor="start">reuse exact poses</text><rect x="241" y="65" width="190" height="68" rx="8" fill="#f6dfcb" stroke="#9caaaf"/><text x="253" y="91" font-size="18" font-weight="700" fill="#172e42" text-anchor="start">Event rule</text><text x="253" y="116" font-size="16" font-weight="400" fill="#172e42" text-anchor="start">threshold edited</text><rect x="480" y="65" width="216" height="68" rx="8" fill="#f6dfcb" stroke="#9caaaf"/><text x="492" y="91" font-size="18" font-weight="700" fill="#172e42" text-anchor="start">Agent decision</text><text x="492" y="116" font-size="16" font-weight="400" fill="#172e42" text-anchor="start">may request a view</text><rect x="241" y="193" width="190" height="68" rx="8" fill="#ddede7" stroke="#9caaaf"/><text x="253" y="219" font-size="18" font-weight="700" fill="#172e42" text-anchor="start">Diagnostic plot</text><text x="253" y="244" font-size="16" font-weight="400" fill="#172e42" text-anchor="start">reuse exact plot</text><path d="M191 160 H214 V99 H236" stroke="#4a5b6b" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M214 160 V227 H236" stroke="#4a5b6b" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M431 99 H475" stroke="#4a5b6b" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="480" y="179" font-size="17" font-weight="400" fill="#172e42" text-anchor="start">On an audited case, run</text><text x="480" y="202" font-size="17" font-weight="400" fill="#172e42" text-anchor="start">the new decision and its</text><text x="480" y="225" font-size="17" font-weight="400" fill="#172e42" text-anchor="start">chosen continuation.</text><path d="M229 95 l9 4 -9 4 z M468 95 l9 4 -9 4 z M229 223 l9 4 -9 4 z" fill="#4a5b6b"/><text x="24" y="304" font-size="17" font-weight="700" fill="#172e42" text-anchor="start">Green nodes can be reused when all recorded dependencies match.</text></g></svg>