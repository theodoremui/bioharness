<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 470" width="1360" height="470" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The single-edit success profile</title>
<desc id="d">A proposer LLM makes 30 independent one-step edits to the same parent variant, in three sessions of ten. Each edit is invalid, valid but not a success, or a success: valid, lowering selection error by at least 1 percent and passing the shrinkage guard. The rates and the mean gain form the profile. Outcomes shown are illustrative.</desc>
