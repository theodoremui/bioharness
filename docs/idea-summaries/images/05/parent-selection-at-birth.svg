<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 640" width="1320" height="640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">What each parent-selection rule knows about two new nodes</title>
<desc id="d">Hypothesis. One parent has two new children, one with degraded code (orange) and one with structured code (blue), each with one evaluation and the same outcome. Each row pairs a rule with its estimate for both nodes, a marker with a bar for its spread: DGM gives both the same development score, HGM gives both the same clade estimate, and HGM with a structural prior separates them using code features alone. Positions are illustrative.</desc>
