<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 500" width="1300" height="500" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Where each optimizer puts the context</title>
<desc id="d">Hypothetical pre-registered predictions at the final checkpoint: under accuracy reward both optimizer types reach the predicted shrinkage band, but only prompt and playbook evolution put most of the framing effect through the analysis path.</desc>
