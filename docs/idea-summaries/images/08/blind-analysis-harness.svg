<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 360" width="1300" height="360" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Blind measurement, then interpretation</title>
<desc id="d">The measurement stage sees no referral and an appearance-masked input; its path and number are committed before the referral is revealed to the interpretation stage.</desc>
<defs><marker id="m4b5563" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="meb6834" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs>
<rect x="0.75" y="0.75" width="1298.5" height="358.5" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<rect x="40.0" y="190.0" width="230.0" height="140.0" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="56.0" y="221.0" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">Masked input</text>
<text x="56.0" y="246.1" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">skeleton render</text>
<text x="56.0" y="268.9" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">no face, no cane</text>
<rect x="300.0" y="190.0" width="230.0" height="140.0" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="316.0" y="221.0" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">Blind measurement</text>
<text x="316.0" y="246.1" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">agent and tools</text>
<text x="316.0" y="268.9" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">no referral in context</text>
<rect x="560.0" y="190.0" width="190.0" height="140.0" rx="12" fill="#ffffff" stroke="#d6d9de" stroke-width="1.6"/>
<text x="576.0" y="221.0" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">Commit</text>
<text x="576.0" y="246.1" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">path and number</text>
<text x="576.0" y="268.9" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">hashed and frozen</text>
<path d="M716.8,213.6 V210.6 a4.8,4.8 0 0 1 9.6,0 V213.6" fill="none" stroke="#4b5563" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="713.8" y="213.6" width="15.6" height="10.8" rx="2.4" fill="#4b5563"/>
<rect x="780.0" y="190.0" width="260.0" height="140.0" rx="12" fill="#fdf0e9" stroke="#eb6834" stroke-width="1.6"/>
<text x="796.0" y="221.0" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">Interpretation</text>
<text x="796.0" y="246.1" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">sees the referral</text>
<text x="796.0" y="268.9" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">pre-declared menu only</text>
<text x="796.0" y="291.7" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">commit is never edited</text>
<rect x="1070.0" y="190.0" width="190.0" height="140.0" rx="12" fill="#fdf0e9" stroke="#eb6834" stroke-width="1.6"/>
<text x="1086.0" y="221.0" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">Decision</text>
<text x="1086.0" y="246.1" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">evidence: commit</text>
<text x="1086.0" y="268.9" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">prior: referral,</text>
<text x="1086.0" y="291.7" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">used once</text>
<rect x="780.0" y="40.0" width="260.0" height="90.0" rx="12" fill="#fdf0e9" stroke="#eb6834" stroke-width="1.6"/>
<text x="796.0" y="71.0" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">Referral</text>
<text x="796.0" y="96.1" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">unlocked after commit</text>
