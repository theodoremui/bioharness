<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 490" width="1300" height="490" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Path splicing as a two-by-two factorial</title>
<desc id="d">Cached transcripts recorded under one referral are replayed into a stateless report step under either referral. Rows fix the referral during the path, columns the referral at the report step; diagonal self-splices are checked against natural runs.</desc>
