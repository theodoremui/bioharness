<text x="436.0" y="326.0" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">Measurement agent</text>
<text x="436.0" y="351.1" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">sees video and referral</text>
<text x="436.0" y="373.9" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">hold time M pulled</text>
<text x="436.0" y="396.7" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">toward the referral</text>
