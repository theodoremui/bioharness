<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 470" width="1300" height="470" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The referral is counted twice</title>
<desc id="d">The referral sets the clinician prior and also shapes the agent measurement; the combiner then treats the measurement as independent evidence.</desc>
