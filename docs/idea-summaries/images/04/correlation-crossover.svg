<svg xmlns="http://www.w3.org/2000/svg" width="736" height="332" viewBox="0 0 736 332" role="img" aria-labelledby="title desc">
<title id="title">A crossover in change accuracy</title><desc id="desc">Both routes are unbiased. Tool A has endpoint standard deviation 6 ms and independent errors. Tool B has endpoint standard deviation 9 ms on each recording. Its change mean squared error drops below that of A when its correlation exceeds five ninths.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#465d6a"/></marker></defs>
<rect x="1" y="1" width="734" height="330" rx="12" fill="#fbfaf6" stroke="#cdd5d2"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="24" y="35" text-anchor="start" font-size="22" font-weight="700" fill="#183347">When does the noisier tool measure change better?</text><text x="24" y="63" text-anchor="start" font-size="17" font-weight="400" fill="#183347">Illustrative model with zero bias and equal cost per recording</text><path d="M83 257.0 H555" fill="none" stroke="#d9dfdf" stroke-width="1"/><text x="73" y="262.0" text-anchor="end" font-size="15" font-weight="400" fill="#465d6a">0</text><path d="M83 219.4 H555" fill="none" stroke="#d9dfdf" stroke-width="1"/><text x="73" y="224.4" text-anchor="end" font-size="15" font-weight="400" fill="#465d6a">40</text><path d="M83 181.8 H555" fill="none" stroke="#d9dfdf" stroke-width="1"/><text x="73" y="186.8" text-anchor="end" font-size="15" font-weight="400" fill="#465d6a">80</text><path d="M83 144.2 H555" fill="none" stroke="#d9dfdf" stroke-width="1"/><text x="73" y="149.2" text-anchor="end" font-size="15" font-weight="400" fill="#465d6a">120</text><path d="M83 106.60000000000002 H555" fill="none" stroke="#d9dfdf" stroke-width="1"/><text x="73" y="111.60000000000002" text-anchor="end" font-size="15" font-weight="400" fill="#465d6a">160</text><text x="83" y="92" text-anchor="start" font-size="16" font-weight="700" fill="#183347">Mean squared change error (ms²)</text><path d="M83 104 V257 H555" fill="none" stroke="#465d6a" stroke-width="1.5"/><path d="M83 257 v5" fill="none" stroke="#465d6a" stroke-width="1"/><text x="83" y="283" text-anchor="middle" font-size="15" font-weight="400" fill="#465d6a">0</text><path d="M201.0 257 v5" fill="none" stroke="#465d6a" stroke-width="1"/><text x="201.0" y="283" text-anchor="middle" font-size="15" font-weight="400" fill="#465d6a">0.25</text><path d="M319.0 257 v5" fill="none" stroke="#465d6a" stroke-width="1"/><text x="319.0" y="283" text-anchor="middle" font-size="15" font-weight="400" fill="#465d6a">0.5</text><path d="M437.0 257 v5" fill="none" stroke="#465d6a" stroke-width="1"/><text x="437.0" y="283" text-anchor="middle" font-size="15" font-weight="400" fill="#465d6a">0.75</text><path d="M555 257 v5" fill="none" stroke="#465d6a" stroke-width="1"/><text x="555" y="283" text-anchor="middle" font-size="15" font-weight="400" fill="#465d6a">1</text><text x="310" y="309" text-anchor="middle" font-size="16" font-weight="700" fill="#183347">Correlation of B’s errors across recordings</text><path d="M83 189.32 H555" fill="none" stroke="#94501a" stroke-width="3" stroke-dasharray="5 5"/><path d="M83 104.72 L555 257.0" fill="none" stroke="#006b65" stroke-width="3"/><circle cx="345.22222222222223" cy="189.32" r="5" fill="#183347"/><path d="M345.22222222222223 181.32 v-35" fill="none" stroke="#183347" stroke-width="1"/><text x="345.22222222222223" y="139.32" text-anchor="middle" font-size="16" font-weight="700" fill="#183347">Tie at 0.56</text><text x="569" y="176" text-anchor="start" font-size="16" font-weight="700" fill="#94501a">A on both trials</text><text x="569" y="199" text-anchor="start" font-size="16" font-weight="400" fill="#183347">6 ms endpoint SD</text><text x="569" y="221" text-anchor="start" font-size="16" font-weight="400" fill="#183347">independent</text><text x="569" y="256" text-anchor="start" font-size="16" font-weight="700" fill="#006b65">B on both trials</text><text x="569" y="279" text-anchor="start" font-size="16" font-weight="400" fill="#183347">9 ms endpoint SD</text><text x="569" y="301" text-anchor="start" font-size="16" font-weight="400" fill="#183347">correlated</text></g></svg>
