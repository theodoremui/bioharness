<svg xmlns="http://www.w3.org/2000/svg" width="736" height="392" viewBox="0 0 736 392" role="img" aria-labelledby="title desc">
<title id="title">Paired tool decisions with hidden force-plate evaluation</title><desc id="desc">Two affordable route outputs start the paired history. The controller can stop, or pay to process a stored view for one recording and return to the history. The evaluator hides unused routes and reference events.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#465d6a"/></marker></defs>
<rect x="1" y="1" width="734" height="390" rx="12" fill="#fbfaf6" stroke="#cdd5d2"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="24" y="35" text-anchor="start" font-size="22" font-weight="700" fill="#183347">What can the policy learn from one more view?</text><rect x="24" y="79" width="199" height="82" rx="8" fill="#e2efeb" stroke="#aab8b8"/><text x="36" y="106" text-anchor="start" font-size="18" font-weight="700" fill="#183347">Paired history</text><text x="36" y="131" text-anchor="start" font-size="16" font-weight="400" fill="#183347">Outputs revealed so far</text><rect x="267" y="79" width="195" height="82" rx="8" fill="#f3e6d6" stroke="#aab8b8"/><text x="279" y="106" text-anchor="start" font-size="18" font-weight="700" fill="#183347">Choose an action</text><text x="279" y="131" text-anchor="start" font-size="16" font-weight="400" fill="#183347">Price each new view</text><rect x="505" y="79" width="207" height="82" rx="8" fill="#e2efeb" stroke="#aab8b8"/><text x="517" y="106" text-anchor="start" font-size="18" font-weight="700" fill="#183347">Stop</text><text x="517" y="131" text-anchor="start" font-size="16" font-weight="400" fill="#183347">Report duration change</text><rect x="245" y="211" width="236" height="82" rx="8" fill="#e9edf1" stroke="#aab8b8"/><text x="257" y="238" text-anchor="start" font-size="18" font-weight="700" fill="#183347">Process a stored view</text><text x="257" y="263" text-anchor="start" font-size="16" font-weight="400" fill="#183347">Choose either recording</text><path d="M224 119 H260" fill="none" stroke="#465d6a" stroke-width="2" marker-end="url(#arrow)"/><path d="M463 119 H499" fill="none" stroke="#465d6a" stroke-width="2" marker-end="url(#arrow)"/><path d="M365 162 V205" fill="none" stroke="#465d6a" stroke-width="2" marker-end="url(#arrow)"/><path d="M244 251 H125 V167" fill="none" stroke="#465d6a" stroke-width="2" marker-end="url(#arrow)"/><text x="26" y="278" text-anchor="start" font-size="16" font-weight="700" fill="#465d6a">Update history</text><path d="M24 317 H711" fill="none" stroke="#ced8d7" stroke-width="1"/><text x="24" y="345" text-anchor="start" font-size="17" font-weight="700" fill="#183347">Hidden during decisions</text><text x="24" y="370" text-anchor="start" font-size="16" font-weight="400" fill="#183347">Other route outputs and the force-plate contrast are available to the evaluator.</text></g></svg>
