<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 590" width="1240" height="590" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Four places where self-improvement can go wrong</title>
<desc id="d">A phone video enters an editable harness made of tools, an encoding of tool outputs and a VLM agent, which reports a balance score. A referral or hypothesis can be given to the agent. Scores on development people feed an improver that proposes an edit; the candidate is scored, and an acceptance rule keeps or rejects it. Proposal 05 studies the editable harness code, 06 the acceptance rule, 07 the encoding of tool outputs and 08 the referral given to the agent.</desc>
