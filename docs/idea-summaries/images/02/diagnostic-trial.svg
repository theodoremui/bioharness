<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" width="760" height="324" role="img" aria-labelledby="title desc">
<title id="title">Diagnostic trial under two hypothetical updates</title><desc id="desc">On slow steps both versions have a 5 millisecond error. On fast steps A has a 5 millisecond error and B a 35 millisecond error. The fallback has a 20 millisecond error everywhere.</desc>
