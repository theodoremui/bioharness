<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The renderer search loop</title>
<desc id="d">Cached tool outputs from development people feed a renderer program; frozen reader A reads the renders and produces fitness on dev-select people and error tables on dev-train people; the archive keeps elites; a text-only mutator edits parent code using the error tables. Sealed participants, held-out readers and held-out tasks are scored only after the search ends.</desc>
