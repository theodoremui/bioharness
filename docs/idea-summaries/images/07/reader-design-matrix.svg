<title id="t">Who sets the fitness and who only reads the result</title>
<desc id="d">Rows are fitness conditions and columns are readers. Filled blue circles set the fitness; filled slate squares are held-out readers from a fitness reader family; open aqua circles are other families and people; an open slate diamond marks the crowd profile used inside one fitness. Shaded columns are readers that set fitness in no condition.</desc>
