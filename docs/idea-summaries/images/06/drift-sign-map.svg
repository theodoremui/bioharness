<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 620" width="1220" height="620" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Correlation threshold below which mean selection lowers the tail</title>
<desc id="d">Threshold correlation rho star equals minus pi times sigma b over one minus pi times sigma a, plotted against the tail share pi for three ratios of tail to majority spread. Below a curve the selection term lowers the tail for that spread ratio; above all three it raises the tail. Evaluation noise does not move the curves. At a tail share of 0.125 the thresholds are minus 0.143, minus 0.286 and minus 0.571.</desc>
