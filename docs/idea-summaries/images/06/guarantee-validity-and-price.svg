<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 600" width="1300" height="600" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Only fresh or sealed tail data keep the guarantee, and protection gets cheaper with more tail people</title>
<desc id="d">Left: with edits pushing against the margin and normal per-person noise, observed rate at which a protected harness breaches the tail margin (is more than the margin worse than the seed on the tail), for four designs; each bar spans 5 to 20 tail people per test, log scale, with the nominal 0.05 marked. For the gates the event is any accepted parent; for certification it is the deployed checkpoint. Per-step testing against the parent and reuse of the same tail people exceed the nominal level; fresh people and checkpoint certification stay below it. Right: with tail-neutral edits, share of the unprotected loop majority gain kept against tail people per test, rising from 9 to 57 percent for fresh gating and 15 to 42 percent for certification, against 97 percent for an oracle.</desc>
