<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 600" width="1260" height="600" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Where the seed harness sits decides when the tail starts to lose</title>
<desc id="d">Schematic of the geometric model. The tail optimum and the mean optimum are joined by the diameter of a ball; inside it, to leading order in step size, the expected tail gain under selection on the mean is negative. Three seed harnesses move toward the mean optimum. Seed 1 on the majority side stays outside the ball and the tail gains throughout. Seed 2 beyond the tail optimum enters the ball at a marked point, which is where its tail curve peaks. Seed 3 starts inside and the tail loses from the start.</desc>
