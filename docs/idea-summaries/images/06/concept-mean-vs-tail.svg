<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Mean improves while the tail turns back</title>
<desc id="d">Illustrative curves of error change since generation 0 for a loop that keeps edits that lower mean error. Mean error falls steadily. Tail error, for the StaBLE fall-risk group, falls for about eight generations, stops gaining, then rises and passes its starting value near generation 24.</desc>
<defs></defs>
<rect x="0.75" y="0.75" width="1198.5" height="558.5" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="60.0" y="58.0" font-size="20.1" font-weight="700" fill="#1f2328" text-anchor="start">The mean keeps improving while the tail turns back</text>
<rect x="1000.0" y="36.0" width="122.0" height="25.3" rx="12.67" fill="#f3f4f6" stroke="#64748b" stroke-width="1.2"/>
<text x="1061.0" y="54.2" font-size="15.3" font-weight="600" fill="#334155" text-anchor="middle">illustrative</text>
