<text x="150.0" y="496.0" font-size="15.3" font-weight="400" fill="#6b7280" text-anchor="middle">0</text>
<line x1="300.0" y1="470.0" x2="300.0" y2="476.0" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
<text x="300.0" y="496.0" font-size="15.3" font-weight="400" fill="#6b7280" text-anchor="middle">10</text>
<line x1="450.0" y1="470.0" x2="450.0" y2="476.0" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
<text x="450.0" y="496.0" font-size="15.3" font-weight="400" fill="#6b7280" text-anchor="middle">20</text>
<line x1="600.0" y1="470.0" x2="600.0" y2="476.0" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
<text x="600.0" y="496.0" font-size="15.3" font-weight="400" fill="#6b7280" text-anchor="middle">30</text>
<line x1="750.0" y1="470.0" x2="750.0" y2="476.0" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
<text x="750.0" y="496.0" font-size="15.3" font-weight="400" fill="#6b7280" text-anchor="middle">40</text>
<line x1="900.0" y1="470.0" x2="900.0" y2="476.0" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
<text x="900.0" y="496.0" font-size="15.3" font-weight="400" fill="#6b7280" text-anchor="middle">50</text>
<text x="525.0" y="526.0" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="middle">generation of the self-improvement loop</text>
<line x1="150.0" y1="218.0" x2="900.0" y2="218.0" stroke="#64748b" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6 6"/>
<text x="138.0" y="223.0" font-size="16.5" font-weight="400" fill="#6b7280" text-anchor="end">start</text>
<text x="138.0" y="120.0" font-size="16.5" font-weight="400" fill="#6b7280" text-anchor="end">worse</text>
<text x="138.0" y="466.0" font-size="16.5" font-weight="400" fill="#6b7280" text-anchor="end">better</text>
<text x="160.0" y="96.0" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">error change since generation 0</text>
