<title id="t">Profiles rank who else gains (illustrative)</title>
<desc id="d">Two illustrative scatters of checkpoint-centered observed gain against forecast gain for held-out VLMs: the registered profile rule ranks readers across and within families, while the family-and-size predictor assigns one value per family and size.</desc>
