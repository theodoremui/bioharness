<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 530" width="1300" height="530" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">One-to-one or many-to-one</title>
<desc id="d">Left: shifting the number toward the referral is one-to-one within each referral. Right: a cap under the high-risk referral merges many blind values into one reported value. Schematic.</desc>
<defs></defs>
<rect x="0.75" y="0.75" width="1298.5" height="528.5" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<line x1="130.0" y1="420.0" x2="580.0" y2="420.0" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round"/>
<line x1="130.0" y1="130.0" x2="130.0" y2="420.0" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round"/>
<text x="130.0" y="70.0" font-size="20.1" font-weight="700" fill="#1f2328" text-anchor="start">One-to-one: a shift that recalibration can undo</text>
<text x="355.0" y="454.0" font-size="16.5" font-weight="600" fill="#1f2328" text-anchor="middle">blind measurement M₀</text>
<text x="130.0" y="112.0" font-size="16.5" font-weight="600" fill="#1f2328" text-anchor="start">reported M</text>
<line x1="790.0" y1="420.0" x2="1240.0" y2="420.0" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round"/>
<line x1="790.0" y1="130.0" x2="790.0" y2="420.0" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round"/>
<text x="790.0" y="70.0" font-size="20.1" font-weight="700" fill="#1f2328" text-anchor="start">Many-to-one: a cap that erases differences</text>
<text x="1015.0" y="454.0" font-size="16.5" font-weight="600" fill="#1f2328" text-anchor="middle">blind measurement M₀</text>
<text x="790.0" y="112.0" font-size="16.5" font-weight="600" fill="#1f2328" text-anchor="start">reported M</text>
<text x="1240.0" y="34.0" font-size="16.5" font-weight="600" fill="#6b7280" text-anchor="end" font-style="italic">schematic</text>
<path d="M140.0,380.0 L560.0,200.0" fill="none" stroke="#eb6834" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M140.0,325.0 L560.0,145.0" fill="none" stroke="#6250d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="420.0" y="194.0" font-size="16.5" font-weight="600" fill="#4a3aa7" text-anchor="end">routine referral b</text>
<text x="300.0" y="338.0" font-size="16.5" font-weight="600" fill="#b9461a" text-anchor="start">high-risk referral a</text>
<text x="355.0" y="500.0" font-size="16.5" font-weight="600" fill="#1f2328" text-anchor="middle">undone by recalibrating within each referral</text>
<path d="M800.0,398.0 L1006.0,270.5" fill="none" stroke="#4b5563" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1006.0,270.5 L1220.0,138.0" fill="none" stroke="#6250d6" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7"/>
<line x1="1075.0" y1="420.0" x2="1075.0" y2="276.5" stroke="#e34948" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/>
<line x1="1215.0" y1="420.0" x2="1215.0" y2="276.5" stroke="#e34948" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/>
<path d="M1006.0,270.5 L1220.0,270.5" fill="none" stroke="#eb6834" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1006.0" cy="270.5" r="5" fill="#eb6834" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="1075.0" cy="270.5" r="5.5" fill="#ffffff" stroke="#e34948" stroke-width="2.2"/>
<circle cx="1215.0" cy="270.5" r="5.5" fill="#ffffff" stroke="#e34948" stroke-width="2.2"/>
<text x="1145.0" y="314.5" font-size="15.3" font-weight="600" fill="#b42d2c" text-anchor="middle">different M₀,</text>
<text x="1145.0" y="336.5" font-size="15.3" font-weight="600" fill="#b42d2c" text-anchor="middle">same report</text>
<text x="1150.0" y="170.0" font-size="16.5" font-weight="600" fill="#4a3aa7" text-anchor="end">routine referral b</text>
<text x="1238.0" y="258.5" font-size="15.3" font-weight="600" fill="#b9461a" text-anchor="end">high-risk referral a</text>
<text x="872.0" y="384.0" font-size="16.5" font-weight="600" fill="#4b5563" text-anchor="start">both referrals</text>
<text x="872.0" y="404.0" font-size="16.5" font-weight="600" fill="#4b5563" text-anchor="start">below the cap</text>
<text x="1015.0" y="500.0" font-size="16.5" font-weight="600" fill="#b42d2c" text-anchor="middle">many-to-one above the cap</text>
</svg>
