<text x="54.0" y="326.0" font-size="18.9" font-weight="700" fill="#1f2328" text-anchor="start">Harness S: typed stages</text>
<text x="54.0" y="354.7" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">Logged stages, named config with</text>
<text x="54.0" y="377.5" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">units, warning-only checks</text>
<rect x="448.0" y="206.0" width="196.0" height="112.0" rx="12" fill="#ffffff" stroke="#d6d9de" stroke-width="1.5"/>
<text x="462.0" y="236.0" font-size="18.9" font-weight="700" fill="#1f2328" text-anchor="start">Same outputs</text>
<text x="462.0" y="264.7" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">Identical scores on</text>
<text x="462.0" y="287.5" font-size="16.5" font-weight="400" fill="#4b5563" text-anchor="start">every input</text>
