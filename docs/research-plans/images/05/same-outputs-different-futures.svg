<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 500" width="1240" height="500" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Same outputs, different futures</title>
<desc id="d">Two harnesses, A and S, produce identical scores on every input. A is a single long function, S is split into typed, logged stages. Under the same optimizer and budget, their illustrative improvement curves start from the same point and diverge; the hypothesized gap comes from how the code is written.</desc>
<defs><marker id="m64748b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
