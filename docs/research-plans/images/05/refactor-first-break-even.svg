<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 560" width="1260" height="560" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">When refactoring first pays off</title>
<desc id="d">Illustrative accept-if-better model. Search alone removes error at per-evaluation rate r0. Refactoring first spends a fixed cost in evaluation-equivalents with no gain, then removes error at a higher rate r1 (0.015 against 0.010). The curves cross at the break-even budget B*, about three times the refactor cost.</desc>
