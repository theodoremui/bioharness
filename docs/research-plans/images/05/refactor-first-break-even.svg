<rect x="0.75" y="0.75" width="1258.5" height="558.5" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-size="20.1" font-weight="700" fill="#1f2328" text-anchor="start">Refactoring first can pay off past a break-even budget</text>
<line x1="130.0" y1="450.0" x2="1010.0" y2="450.0" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round"/>
