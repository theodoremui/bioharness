<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" width="1300" height="560" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The Y-Balance score computed two ways</title>
<desc id="d">Top: the StaBLE Y-Balance score computation as one function with inline thresholds; the optimizer gets only the score error. Bottom: harness S, the same computation from the same cached pose input as five typed stages that read thresholds from a named config, run two warning-only checks and write a per-stage trace that the optimizer reads. Task scores are identical.</desc>
