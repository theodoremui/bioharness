<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 750" width="1360" height="750" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Two tiers: many cheap edits, fewer loops</title>
<desc id="d">Top: the eight-cell resolution IV half fraction over modularity, observability, parameters and checks (I = MOPT), crossed with 20 base harnesses and three proposers; cells 1 and 8 also get naming and control arms. Bottom: three of the 20 bases give 96 configurations (32 settings each, naming opaque or physical). Each gets a profile forecast and a clade estimate from 300 evaluations each, and each predictor is correlated within base with the observed sealed-test gain of its validation loops.</desc>
