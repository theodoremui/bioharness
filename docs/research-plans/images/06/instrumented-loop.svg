<text x="369.0" y="176.0" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">writes K candidate edits</text>
<text x="369.0" y="197.2" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">per generation</text>
<rect x="670.0" y="120.0" width="250.0" height="108.0" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="684.0" y="149.0" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">Gate on dev people</text>
<text x="684.0" y="176.0" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">score S; keep the best</text>
<text x="684.0" y="197.2" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">candidate if S &gt; τ</text>
