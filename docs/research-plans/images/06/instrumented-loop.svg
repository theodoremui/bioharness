<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 680" width="1300" height="680" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Every candidate is scored on hidden guard people</title>
<desc id="d">Flowchart. A parent harness goes to a proposer that writes K candidate edits per generation. Dev people score each candidate and the gate keeps the best if its score passes the threshold; the kept edit becomes the next parent. All K candidates are also scored on guard people, who are hidden from the proposer and the gate. The guard log pairs each candidate tail effect on guard people with the keep or reject decision. Saved checkpoints go to sealed test people. A forecast fitted on generations 0 to 10 and frozen at generation 10 is compared with the tail change they measure at generation 50.</desc>
