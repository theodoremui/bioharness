<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 560" width="1260" height="560" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Tail share sets the sign of drift; tail sample size scales it</title>
<desc id="d">Global-MMLU design. Grid of twelve cells, tail share pi of 0.05, 0.10, 0.20 and 0.40 by tail evaluation size of 16, 64 and 256 items. Each cell shows the drift per proposal the correlated-response law predicts for an assumed correlation of minus 0.3, equal spreads and zero mean effects. Cells with pi up to 0.20 are predicted to harm the tail, cells with pi 0.40 to help it; a bracket marks the predicted sign change near pi 0.23, where the model predicts zero drift. More tail items raise the gain at pi 0.40 from 0.083 to 0.123 without changing its sign.</desc>
