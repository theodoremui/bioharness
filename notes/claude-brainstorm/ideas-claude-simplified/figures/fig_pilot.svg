<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 430" width="1300" height="430" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Pilot results on 43 held-out participants</title>
<desc id="d">Task-averaged mean absolute error for six methods. The fine-tuned model scores 0.100, the constant guess 0.120 and the model without fine-tuning 0.238.</desc>
<defs></defs>
<rect x="0.75" y="0.75" width="1298.5" height="428.5" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="24.0" y="36.0" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">Task-averaged mean absolute error, 43 test participants (lower is better)</text>
<line x1="450.0" y1="54.0" x2="450.0" y2="360.0" stroke="#eceef1" stroke-width="1" stroke-linecap="round"/>
<text x="450.0" y="382.0" font-size="14.8" font-weight="400" fill="#6b7280" text-anchor="middle">0.00</text>
<line x1="584.0" y1="54.0" x2="584.0" y2="360.0" stroke="#eceef1" stroke-width="1" stroke-linecap="round"/>
<text x="584.0" y="382.0" font-size="14.8" font-weight="400" fill="#6b7280" text-anchor="middle">0.05</text>
<line x1="718.0" y1="54.0" x2="718.0" y2="360.0" stroke="#eceef1" stroke-width="1" stroke-linecap="round"/>
<text x="718.0" y="382.0" font-size="14.8" font-weight="400" fill="#6b7280" text-anchor="middle">0.10</text>
<line x1="852.0" y1="54.0" x2="852.0" y2="360.0" stroke="#eceef1" stroke-width="1" stroke-linecap="round"/>
<text x="852.0" y="382.0" font-size="14.8" font-weight="400" fill="#6b7280" text-anchor="middle">0.15</text>
<line x1="986.0" y1="54.0" x2="986.0" y2="360.0" stroke="#eceef1" stroke-width="1" stroke-linecap="round"/>
<text x="986.0" y="382.0" font-size="14.8" font-weight="400" fill="#6b7280" text-anchor="middle">0.20</text>
<line x1="1120.0" y1="54.0" x2="1120.0" y2="360.0" stroke="#eceef1" stroke-width="1" stroke-linecap="round"/>
<text x="1120.0" y="382.0" font-size="14.8" font-weight="400" fill="#6b7280" text-anchor="middle">0.25</text>
<text x="434.0" y="81.0" font-size="15.9" font-weight="400" fill="#1f2328" text-anchor="end">Qwen3-VL-8B fine-tuned to output scores</text>
<path d="M450,66 H714.0 a4,4 0 0 1 4,4 V86 a4,4 0 0 1 -4,4 H450 Z" fill="#2a78d6"/>
<text x="726.0" y="83.0" font-size="15.9" font-weight="700" fill="#1f2328" text-anchor="start">0.100</text>
<text x="434.0" y="131.0" font-size="15.9" font-weight="400" fill="#1f2328" text-anchor="end">2D pose (RTMPose) + temporal network</text>
<path d="M450,116 H764.92 a4,4 0 0 1 4,4 V136 a4,4 0 0 1 -4,4 H450 Z" fill="#2a78d6"/>
<text x="776.9" y="133.0" font-size="15.9" font-weight="700" fill="#1f2328" text-anchor="start">0.119</text>
<text x="434.0" y="181.0" font-size="15.9" font-weight="400" fill="#1f2328" text-anchor="end">Constant guess: each task’s training average</text>
<path d="M450,166 H767.5999999999999 a4,4 0 0 1 4,4 V186 a4,4 0 0 1 -4,4 H450 Z" fill="#9aa3af"/>
<text x="779.6" y="183.0" font-size="15.9" font-weight="700" fill="#1f2328" text-anchor="start">0.120</text>
<text x="833.6" y="183.0" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">uses no video</text>
<text x="434.0" y="231.0" font-size="15.9" font-weight="400" fill="#1f2328" text-anchor="end">OpenCap Monocular + StaBLE rules</text>
<path d="M450,216 H837.28 a4,4 0 0 1 4,4 V236 a4,4 0 0 1 -4,4 H450 Z" fill="#2a78d6"/>
<text x="849.3" y="233.0" font-size="15.9" font-weight="700" fill="#1f2328" text-anchor="start">0.146</text>
<text x="903.3" y="233.0" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">error over its 567 valid cases only</text>
<text x="434.0" y="281.0" font-size="15.9" font-weight="400" fill="#1f2328" text-anchor="end">Qwen3-VL-8B asked for features, score by formula</text>
<path d="M450,266 H925.72 a4,4 0 0 1 4,4 V286 a4,4 0 0 1 -4,4 H450 Z" fill="#2a78d6"/>
<text x="937.7" y="283.0" font-size="15.9" font-weight="700" fill="#1f2328" text-anchor="start">0.179</text>
<text x="434.0" y="331.0" font-size="15.9" font-weight="400" fill="#1f2328" text-anchor="end">Qwen3-VL-8B asked for a score, no fine-tuning</text>
<path d="M450,316 H1083.84 a4,4 0 0 1 4,4 V336 a4,4 0 0 1 -4,4 H450 Z" fill="#2a78d6"/>
<text x="1095.8" y="333.0" font-size="15.9" font-weight="700" fill="#1f2328" text-anchor="start">0.238</text>
<line x1="771.6" y1="50.0" x2="771.6" y2="360.0" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="777.6" y="46.0" font-size="14.2" font-weight="400" fill="#4b5563" text-anchor="start">constant guess</text>
<text x="24.0" y="408.0" font-size="14.8" font-weight="400" fill="#6b7280" text-anchor="start">Error = average distance between predicted and reference task scores on the 0–1 scale, per task, then averaged over tasks.</text>
</svg>
