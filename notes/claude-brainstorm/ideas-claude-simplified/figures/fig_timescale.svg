<text x="298.0" y="72.0" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">slowed to 0.8× speed</text>
<rect x="720.0" y="40.0" width="556.0" height="300.0" rx="14" fill="#f6f7f9" stroke="#d6d9de" stroke-width="1.5"/>
<text x="740.0" y="70.0" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">What should happen to each feature</text>
<text x="740.0" y="108.0" font-size="16.5" font-weight="700" fill="#1f2328" text-anchor="start">Hold time</text>
<text x="930.0" y="108.0" font-size="16.5" font-weight="700" fill="#1f2328" text-anchor="start">longer, ×1.25</text>
<text x="930.0" y="130.0" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">but never past the 5-second cap: a 4.5 s</text>
<text x="930.0" y="150.4" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">hold becomes 5 s, not 5.6 s</text>
<text x="740.0" y="184.0" font-size="16.5" font-weight="700" fill="#1f2328" text-anchor="start">Peak upward speed</text>
<text x="930.0" y="184.0" font-size="16.5" font-weight="700" fill="#1f2328" text-anchor="start">slower, ×0.8</text>
<text x="930.0" y="206.0" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">the same rise now takes longer</text>
<text x="740.0" y="260.0" font-size="16.5" font-weight="700" fill="#1f2328" text-anchor="start">Peak ankle angle</text>
<text x="930.0" y="260.0" font-size="16.5" font-weight="700" fill="#1f2328" text-anchor="start">unchanged</text>
<text x="930.0" y="282.0" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">angles do not depend on timing</text>
<text x="24.0" y="384.0" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">Frames are resampled and timestamps corrected, so the person looks identical and only the speed of the movement changes. A method that measures movement</text>
<text x="24.0" y="405.2" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">should respond as predicted; a method that reads appearance should not.</text>
</svg>
