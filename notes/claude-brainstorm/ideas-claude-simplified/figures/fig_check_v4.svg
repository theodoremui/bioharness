<line x1="988.0" y1="114.0" x2="1160.0" y2="114.0" stroke="#1baf7a" stroke-width="6" stroke-linecap="round"/>
<text x="988.0" y="140.0" font-size="13.6" font-weight="400" fill="#6b7280" text-anchor="middle">0.03</text>
<text x="1160.0" y="140.0" font-size="13.6" font-weight="400" fill="#6b7280" text-anchor="middle">0.52 m/s</text>
<text x="1074.0" y="94.0" font-size="14.2" font-weight="400" fill="#4b5563" text-anchor="middle">training range</text>
<text x="902.0" y="94.0" font-size="13.6" font-weight="400" fill="#6b7280" text-anchor="start">widened</text>
<text x="1246.0" y="94.0" font-size="13.6" font-weight="400" fill="#6b7280" text-anchor="end">widened</text>
<circle cx="1086.3" cy="114.0" r="8" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<text x="1086.3" y="164.0" font-size="14.8" font-weight="700" fill="#1f2328" text-anchor="middle">0.31 ✓</text>
<text x="888.0" y="202.0" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">The value must lie within the training range</text>
<text x="888.0" y="222.4" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">widened by half its width on each side, and</text>
<text x="888.0" y="242.8" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">within physical limits (hold time between 0 and</text>
<text x="888.0" y="263.2" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">5 s). A speed of 2.4 m/s for rising onto the</text>
<text x="888.0" y="283.6" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">toes fails.</text>
