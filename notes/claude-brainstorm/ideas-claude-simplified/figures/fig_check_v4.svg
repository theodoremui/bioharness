<text x="464.0" y="202.0" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">The two results must differ, in the same</text>
<text x="464.0" y="222.4" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">direction as their reference values, by at</text>
<text x="464.0" y="242.8" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">least a quarter of the feature’s typical spread</text>
<text x="464.0" y="263.2" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">in training data. A constant, or a constant</text>
<text x="464.0" y="283.6" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">plus a negligible term, fails.</text>
