<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 490" width="1300" height="490" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The privileged teacher</title>
<desc id="d">A large teacher model sees the three-camera reference panel but acts only through the student’s tools. Its runs are filtered and stripped of the panel before the student is fine-tuned on them.</desc>
<defs><marker id="m64748b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="meb6834" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs>
<rect x="0.75" y="0.75" width="1298.5" height="488.5" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<rect x="24.0" y="40.0" width="260.0" height="130.0" rx="12" fill="#ffffff" stroke="#d6d9de" stroke-width="1.5"/>
<text x="38.0" y="69.0" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">Same inputs as the</text>
<text x="38.0" y="92.1" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">student</text>
<text x="38.0" y="119.0" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">one-camera video, task text,</text>
<text x="38.0" y="140.2" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">the same cached tools</text>
<rect x="24.0" y="196.0" width="260.0" height="150.0" rx="12" fill="#fdf0e9" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="38.0" y="225.0" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">Reference panel</text>
<text x="38.0" y="248.1" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">(training videos only)</text>
<text x="38.0" y="275.0" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">three-camera joint-angle and</text>
<text x="38.0" y="296.2" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">center-of-mass curves, and</text>
<text x="38.0" y="317.4" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">the reference feature values</text>
<rect x="330.0" y="100.0" width="250.0" height="180.0" rx="12" fill="#f0eefc" stroke="#6250d6" stroke-width="1.5"/>
<text x="344.0" y="129.0" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">Teacher model</text>
<text x="344.0" y="156.0" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">Qwen3-VL-235B, frozen. The</text>
<text x="344.0" y="177.2" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">panel helps it find where</text>
<text x="344.0" y="198.4" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">the one-camera tools went</text>
<text x="344.0" y="219.6" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">wrong; it acts only through</text>
<text x="344.0" y="240.8" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">the student’s tools.</text>
<path d="M286.0,105.0 L326.0,150.0" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#m64748b)"/>
<path d="M286.0,270.0 L326.0,230.0" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#meb6834)"/>
<path d="M582.0,190.0 L622.0,190.0" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#m64748b)"/>
<rect x="626.0" y="40.0" width="340.0" height="306.0" rx="12" fill="#f6f7f9" stroke="#d6d9de" stroke-width="1.5"/>
<text x="644.0" y="70.0" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">Keep a demonstration only if</text>
<circle cx="656.0" cy="108.0" r="10" fill="#1baf7a" stroke="#1baf7a" stroke-width="1"/>
<path d="M651.5,108.2 L655.0,111.8 L661.0,104.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="676.0" y="113.0" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">every submitted feature passes</text>
<text x="676.0" y="134.2" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">the same check as the student’s</text>
<circle cx="656.0" cy="179.4" r="10" fill="#1baf7a" stroke="#1baf7a" stroke-width="1"/>
<path d="M651.5,179.6 L655.0,183.2 L661.0,175.9" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="676.0" y="184.4" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">its feature code is at least as</text>
<text x="676.0" y="205.6" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">accurate as the expert pipeline</text>
<text x="676.0" y="226.8" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">on five other videos of the task</text>
<circle cx="656.0" cy="272.0" r="10" fill="#1baf7a" stroke="#1baf7a" stroke-width="1"/>
<path d="M651.5,272.2 L655.0,275.8 L661.0,268.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="676.0" y="277.0" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">after the panel is removed, no</text>
<text x="676.0" y="298.2" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">remaining text refers to it</text>
<path d="M968.0,190.0 L1008.0,190.0" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#m64748b)"/>
<rect x="1012.0" y="100.0" width="264.0" height="180.0" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="1026.0" y="129.0" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">Student</text>
<text x="1026.0" y="156.0" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">Qwen3-VL-8B, trained on the</text>
<text x="1026.0" y="177.2" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">kept demonstrations. Never</text>
<text x="1026.0" y="198.4" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">receives the panel.</text>
<rect x="24.0" y="380.0" width="1252.0" height="86.0" rx="12" fill="#ffffff" stroke="#d6d9de" stroke-width="1.5"/>
<text x="44.0" y="408.0" font-size="15.9" font-weight="700" fill="#1f2328" text-anchor="start">Comparison arm</text>
<text x="44.0" y="430.0" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">A plain teacher (the same model, without the panel) goes through the same filters with the same number of attempts. Comparing the two warm starts</text>
<text x="44.0" y="451.2" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">shows what the panel adds.</text>
</svg>
