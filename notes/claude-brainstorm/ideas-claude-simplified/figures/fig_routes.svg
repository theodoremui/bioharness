<text x="653.0" y="418.0" font-size="15.9" font-weight="600" fill="#1f2328" text-anchor="middle">Features +</text>
<text x="653.0" y="440.0" font-size="15.9" font-weight="600" fill="#1f2328" text-anchor="middle">code</text>
<path d="M714.0,423.0 L734.0,423.0" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#m64748b)"/>
<rect x="738.0" y="394.0" width="150.0" height="58.0" rx="10" fill="#ffffff" stroke="#d6d9de" stroke-width="1.5"/>
<text x="813.0" y="418.0" font-size="15.9" font-weight="600" fill="#1f2328" text-anchor="middle">Fixed formula</text>
<text x="813.0" y="440.0" font-size="15.9" font-weight="600" fill="#1f2328" text-anchor="middle">→ score</text>
<text x="912.0" y="392.0" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">+ every number traces to code and tool</text>
<text x="912.0" y="412.4" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">outputs</text>
<text x="912.0" y="434.8" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">+ can switch tools when one fails</text>
<text x="912.0" y="457.2" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">? must learn to choose and check tools</text>
