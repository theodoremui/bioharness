<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 500" width="1300" height="500" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Three ways to get a balance score from video</title>
<desc id="d">Reconstruct and measure, learn to predict, and learn to conduct the analysis with a tool-calling agent, each with its main strength and weakness.</desc>
