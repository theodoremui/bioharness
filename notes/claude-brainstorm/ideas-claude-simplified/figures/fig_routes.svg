<text x="848.0" y="112.0" font-size="15.9" font-weight="600" fill="#1f2328" text-anchor="middle">Score</text>
<text x="912.0" y="76.0" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">+ every step can be plotted and checked</text>
<text x="912.0" y="98.4" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">− if one step fails there is no score; slow</text>
<text x="912.0" y="118.8" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">to compute</text>
<rect x="24.0" y="182.0" width="1252.0" height="142.0" rx="14" fill="#f6f7f9" stroke="#d6d9de" stroke-width="1.5"/>
<text x="44.0" y="216.0" font-size="18.9" font-weight="700" fill="#1f2328" text-anchor="start">Learn to predict</text>
