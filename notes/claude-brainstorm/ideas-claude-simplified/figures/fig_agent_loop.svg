<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 660" width="1300" height="660" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The agent loop and one example trajectory</title>
<desc id="d">Left: the vision-language model writes tool calls; the harness runs the tools and returns results; the final submission goes through a fixed formula to give the score. Right: an illustrative trajectory for rise to toes.</desc>
<defs><marker id="m64748b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="m2a78d6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs>
<rect x="0.75" y="0.75" width="1298.5" height="658.5" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="24.0" y="44.0" font-size="18.9" font-weight="700" fill="#1f2328" text-anchor="start">A   How the parts connect</text>
<rect x="24.0" y="70.0" width="250.0" height="210.0" rx="12" fill="#ffffff" stroke="#d6d9de" stroke-width="1.5"/>
<text x="38.0" y="99.0" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">Inputs</text>
<text x="38.0" y="126.0" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">Video from one phone</text>
<text x="38.0" y="152.2" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">Task description</text>
<text x="38.0" y="178.3" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">Feature definitions with</text>
<text x="38.0" y="199.5" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">units</text>
<text x="38.0" y="225.7" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">Height and lens parameters</text>
<text x="38.0" y="246.9" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">(passed to the tools)</text>
<rect x="330.0" y="70.0" width="300.0" height="150.0" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="344.0" y="99.0" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">Vision-language model</text>
<text x="344.0" y="126.0" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">Qwen3-VL-8B. Reads text, video</text>
<text x="344.0" y="147.2" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">frames and plots; writes the next</text>
<text x="344.0" y="168.4" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">step as text, which may be a tool</text>
<text x="344.0" y="189.6" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">call.</text>
<path d="M276.0,145.0 L326.0,145.0" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#m64748b)"/>
<rect x="330.0" y="320.0" width="300.0" height="150.0" rx="12" fill="#f3f4f6" stroke="#64748b" stroke-width="1.5"/>
<text x="344.0" y="349.0" font-size="17.7" font-weight="700" fill="#1f2328" text-anchor="start">Harness (ordinary code)</text>
<text x="344.0" y="376.0" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">Spots a tool call in the text,</text>
<text x="344.0" y="397.2" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">runs the tool, writes the result</text>
<text x="344.0" y="418.4" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">back, keeps the transcript and</text>
<text x="344.0" y="439.6" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">stops at submit.</text>
