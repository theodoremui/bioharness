<text x="987.9" y="484.0" font-size="14.8" font-weight="700" fill="#1f2328" text-anchor="middle">0.31 ✓</text>
<text x="676.0" y="522.0" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">The value must lie within the training range widened by half its width on</text>
<text x="676.0" y="542.4" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">each side, and within physical limits (hold time between 0 and 5 s). A</text>
<text x="676.0" y="562.8" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">speed of 2.4 m/s for rising onto the toes fails.</text>
