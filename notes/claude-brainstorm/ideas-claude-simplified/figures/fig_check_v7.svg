<text x="676.0" y="238.0" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">Each feature has a few planned edits of the signal it is defined on. The</text>
<text x="676.0" y="258.4" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">agent’s code must react as StaBLE’s released code reacts to the same edit,</text>
<text x="676.0" y="278.8" font-size="14.8" font-weight="400" fill="#4b5563" text-anchor="start">including edits that should change nothing.</text>
