<text x="42.0" y="690.0" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">Tested before training: a fixed suite of deliberate shortcut programs (typical values, wrong body part, wrong units, clip length only and others)</text>
<text x="42.0" y="711.2" font-size="15.3" font-weight="400" fill="#4b5563" text-anchor="start">must fail wherever probe answers differ, and the expert pipeline’s own code must pass.</text>
